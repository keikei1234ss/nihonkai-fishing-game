<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>日本海千年釣り物語 ― 序：黄金のチヌ ―</title>
  <style>
    :root {
      --bg: #05070b;
      --ink: #d8d0ba;
      --dim: #8e8879;
      --line: #2d3442;
      --gold: #b99328;
      --blood: #461017;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
      touch-action: manipulation;
    }

    body {
      display: grid;
      place-items: center;
    }

    #shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 18%, rgba(59, 72, 82, 0.22), transparent 34%),
        linear-gradient(180deg, #05070b 0%, #080c12 100%);
    }

    canvas {
      width: min(100vw, calc(100vh * 0.5625));
      height: min(100vh, calc(100vw * 1.7778));
      max-width: 100vw;
      max-height: 100vh;
      border: 1px solid #1b2029;
      background: #05070b;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    #tapButton {
      position: absolute;
      left: 50%;
      top: max(16px, env(safe-area-inset-top));
      transform: translateX(-50%);
      min-width: 176px;
      min-height: 48px;
      padding: 12px 24px;
      border: 2px solid #6e654e;
      border-radius: 6px;
      color: #f1e6c9;
      background: rgba(11, 13, 17, 0.92);
      font: 700 18px/1 "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: 0;
      box-shadow: 0 8px 0 #030406;
      touch-action: manipulation;
    }

    #musicToggle {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      min-width: 72px;
      min-height: 42px;
      padding: 10px 12px;
      border: 2px solid #4f496e;
      border-radius: 6px;
      color: #cfc6ff;
      background: rgba(4, 5, 10, 0.9);
      font: 700 14px/1 "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: 0;
      box-shadow: 0 6px 0 #020207;
      touch-action: manipulation;
    }

    #musicToggle[aria-pressed="false"] {
      color: #756f86;
      border-color: #2c2a38;
    }

    #tapButton:active {
      top: calc(max(16px, env(safe-area-inset-top)) + 2px);
      box-shadow: 0 6px 0 #030406;
    }

    #musicToggle:active {
      top: calc(max(16px, env(safe-area-inset-top)) + 2px);
      box-shadow: 0 4px 0 #020207;
    }

    @media (max-height: 560px) {
      #tapButton {
        top: 10px;
        min-height: 42px;
        font-size: 16px;
      }

      #musicToggle {
        top: 10px;
        min-height: 38px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="shell">
    <canvas id="game" width="360" height="640" aria-label="釣りホラーゲーム"></canvas>
    <button id="tapButton" type="button">はじめる</button>
    <button id="musicToggle" type="button" aria-pressed="true">BGM</button>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const tapButton = document.getElementById("tapButton");
      const musicToggle = document.getElementById("musicToggle");
      const W = canvas.width;
      const H = canvas.height;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const elderImage = new Image();
      elderImage.src = "assets/elder-expressions.png";
      const bgm = new Audio("Beneath_the_Cold_Water.mp3");
      bgm.loop = true;
      bgm.preload = "auto";
      bgm.volume = 0.35;

      const game = {
        state: "title",
        normalChinuCount: 0,
        isBossNext: false,
        currentFishType: "normal",
        floatState: "idle",
        biteTimer: 0,
        catchWindow: 0,
        elderAngerLevel: 0,
        returnedOnce: localStorage.getItem("nihonkai_chinu_returned") === "1",
        fish: { x: 224, y: 292, phase: 0 },
        float: { x: 0, y: 0, sinkAge: 0 },
        message: "",
        speaker: "",
        titleTick: 0,
        waveTick: 0,
        introIndex: 0,
        eventIndex: 0,
        eventTimer: 0,
        failCount: 0,
        showHumanShadowUntil: 0,
        endingReady: false,
      };

      const sound = {
        context: null,
        master: null,
        waveGain: null,
        droneGain: null,
        pulseGain: null,
        timer: 0,
        started: false,
        bgmEnabled: true,
        bgmStarted: false,
        bgmFailed: false,
      };

      const elderSprites = {
        normal: spriteFromGrid(1),
        blank: spriteFromGrid(2),
        stare: spriteFromGrid(3),
        thinSmile: spriteFromGrid(4),
        coldSmile: spriteFromGrid(5),
        sideEye: spriteFromGrid(6),
        bitter: spriteFromGrid(7),
        contempt: spriteFromGrid(8),
        displeased: spriteFromGrid(10),
        impatient: spriteFromGrid(11),
        tongue: spriteFromGrid(12),
        angerStart: spriteFromGrid(13),
        rage: spriteFromGrid(14),
        gritted: spriteFromGrid(15),
        crookedSmile: spriteFromGrid(16),
        obsession: spriteFromGrid(19),
        madness: spriteFromGrid(20),
        blessed: spriteFromGrid(21),
        possessed: spriteFromGrid(23),
        rampage: spriteFromGrid(24),
      };

      function spriteFromGrid(number) {
        const index = number - 1;
        const col = index % 8;
        const row = Math.floor(index / 8);
        return {
          sx: 14 + col * 189,
          sy: 73 + row * 162,
          sw: 186,
          sh: 133,
        };
      }

      const introLines = [
        ["地の文", "日本海沿いを旅するあなたは、小浜漁港へ立ち寄った。港そのものは静かで、いつもの暮らしの匂いがある。けれど今夜だけ、波の間に古い鈴の音が混じる。"],
        ["地の文", "岸壁の陰から、濡れた藁のような老人が這い出てくる。"],
        ["老人", "旅の者……黄金のチヌを釣れ。古い祠のヌシじゃ。あれを釣れば、わしは……まだ戻れる。"],
        ["あなた", "祠のヌシを、なぜ欲しがる。"],
        ["老人", "祠？ 知るか。効くなら使えばええ。御神体に触れたくらいで、海が惜しむものか。早くせんか……日が沈む前に……"],
        ["地の文", "弱った声の底で、歯ぎしりだけが若い。あなたは潮の暗がりへ竿を出した。"],
      ];

      const fishLines = [
        "魚影の近くを押してウキを投げる。",
        "波がひとつ遅れている。",
        "ウキが沈む瞬間だけ、港の音が遠のく。",
        "老人の呼吸が背中に近い。",
      ];

      const elderLines = [
        "早くせんか……日が沈む前に……",
        "違う、それではない。金色のやつを釣れ。",
        "手間をかけさせるな。おまえは竿だけ見ておればええ。",
        "まだか。金色のやつを逃がすな。わしを待たせるな。",
      ];

      const bossLines = [
        ["地の文", "二匹目のチヌを上げたとき、波音がぷつりと切れた。"],
        ["老人", "来た。金色じゃ。ほれ、祠の魚じゃ。"],
        ["地の文", "海の色が一段沈む。魚影は一瞬、人の肩の形をした。"],
      ];

      const bossCaughtLines = [
        ["地の文", "黄金のチヌを釣り上げた。ぬめる鱗が、古い鏡のように鈍く光る。"],
        ["老人", "よこせ。わしのものじゃ。わしが見つけた力じゃ。"],
        ["地の文", "老人は礼も祈りもなく、奪うように黄金のチヌへ歯を立てた。"],
        ["老人", "若さが戻る……力が戻る……！"],
      ];

      const endingLines = [
        ["地の文", "老人の背が一瞬だけ伸び、頬に赤みが差した。"],
        ["地の文", "だが次の瞬間、胸と喉から赤黒い勾玉が浮かび上がる。欲望と祟りが、同じ形をしていた。"],
        ["地の文", "勾玉は潮風を裂き、日本海へ飛び散った。金沢の方へ。新潟の方へ。まだ名を持たぬ海辺の祠へ。"],
        ["地の文", "千年の釣りは、ここから始まる"],
      ];

      function setState(next) {
        game.state = next;
        if (next === "intro") {
          game.introIndex = 0;
          setDialogue(introLines[0]);
        }
        if (next === "fishing") {
          prepareFish();
          setDialogue(["地の文", fishLines[0]]);
        }
        if (next === "bossAppears") {
          game.eventIndex = 0;
          setDialogue(bossLines[0]);
        }
        if (next === "bossCaught") {
          game.eventIndex = 0;
          game.eventTimer = 0;
          setDialogue(bossCaughtLines[0]);
        }
        if (next === "ending") {
          game.eventIndex = 0;
          game.eventTimer = 0;
          game.endingReady = false;
          localStorage.setItem("nihonkai_chinu_returned", "1");
          setDialogue(endingLines[0]);
        }
        updateButton();
      }

      function setDialogue(line) {
        game.speaker = line[0];
        game.message = line[1];
      }

      function ensureAudio() {
        startBgm();

        if (!AudioContextClass) return;
        if (!sound.context) {
          const context = new AudioContextClass();
          sound.context = context;
          sound.master = context.createGain();
          sound.master.gain.value = 0.34;
          sound.master.connect(context.destination);

          createWaveSound(context);
          sound.started = true;
        }

        if (sound.context.state === "suspended") {
          sound.context.resume();
        }
      }

      function startBgm() {
        if (!sound.bgmEnabled || sound.bgmFailed) return;

        bgm.play()
          .then(() => {
            sound.bgmStarted = true;
            updateMusicButton();
          })
          .catch(() => {
            sound.bgmFailed = true;
            updateMusicButton();
          });
      }

      function updateMusicButton() {
        if (sound.bgmFailed) {
          musicToggle.textContent = "BGM不可";
          musicToggle.setAttribute("aria-pressed", "false");
          return;
        }

        musicToggle.textContent = sound.bgmEnabled ? "BGM" : "消音";
        musicToggle.setAttribute("aria-pressed", String(sound.bgmEnabled));
      }

      function toggleBgm() {
        sound.bgmEnabled = !sound.bgmEnabled;

        if (sound.bgmEnabled) {
          bgm.muted = false;
          startBgm();
        } else {
          bgm.pause();
        }

        updateMusicButton();
      }

      function createWaveSound(context) {
        const bufferSize = context.sampleRate * 2;
        const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;

        for (let i = 0; i < bufferSize; i += 1) {
          last = last * 0.985 + (Math.random() * 2 - 1) * 0.015;
          data[i] = last;
        }

        const noise = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const swell = context.createGain();
        const lfo = context.createOscillator();
        const lfoGain = context.createGain();

        noise.buffer = buffer;
        noise.loop = true;
        filter.type = "bandpass";
        filter.frequency.value = 640;
        filter.Q.value = 0.55;
        swell.gain.value = 0.05;
        lfo.frequency.value = 0.13;
        lfoGain.gain.value = 0.045;

        lfo.connect(lfoGain);
        lfoGain.connect(swell.gain);
        noise.connect(filter);
        filter.connect(swell);
        swell.connect(sound.master);
        noise.start();
        lfo.start();
        sound.waveGain = swell;
      }

      function createDrone(context) {
        sound.droneGain = context.createGain();
        sound.droneGain.gain.value = 0.045;
        sound.droneGain.connect(sound.master);

        [48, 55.5, 72].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = index === 1 ? "sawtooth" : "sine";
          oscillator.frequency.value = frequency;
          gain.gain.value = index === 1 ? 0.028 : 0.04;
          oscillator.connect(gain);
          gain.connect(sound.droneGain);
          oscillator.start();
        });
      }

      function playUneasyNote() {
        if (!sound.context) return;

        const context = sound.context;
        const now = context.currentTime;
        const oscillator = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        const notes = game.currentFishType === "boss" ? [145, 149, 193, 217] : [97, 103, 128, 145];
        const note = notes[Math.floor(Math.random() * notes.length)];

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(note, now);
        oscillator.frequency.exponentialRampToValueAtTime(note * 0.985, now + 1.8);
        filter.type = "lowpass";
        filter.frequency.value = game.currentFishType === "boss" ? 520 : 380;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(game.currentFishType === "boss" ? 0.06 : 0.035, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.9);

        oscillator.connect(filter);
        filter.connect(gain);
        gain.connect(sound.master);
        oscillator.start(now);
        oscillator.stop(now + 2);
      }

      function playTapSound(kind) {
        if (!sound.context) return;

        const context = sound.context;
        const now = context.currentTime;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = kind === "sink" ? "sine" : "square";
        oscillator.frequency.value = kind === "sink" ? 118 : 196;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(kind === "sink" ? 0.13 : 0.055, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (kind === "sink" ? 0.42 : 0.14));
        oscillator.connect(gain);
        gain.connect(sound.master);
        oscillator.start(now);
        oscillator.stop(now + 0.48);
      }

      function updateAudioMood() {
        const boss = game.currentFishType === "boss" || game.state === "ending" || game.state === "bossCaught";
        bgm.volume = sound.bgmEnabled ? (boss ? 0.18 : 0.35) : 0;

        if (!sound.context || !sound.waveGain) return;

        const now = sound.context.currentTime;
        const waveLevel = boss ? 0.012 : 0.05;
        sound.waveGain.gain.setTargetAtTime(waveLevel, now, 0.8);
      }

      function updateButton() {
        if (game.state === "title" || game.state === "returnedTitle") {
          tapButton.hidden = false;
          tapButton.textContent = "はじめる";
        } else if (game.state === "intro" || game.state === "bossAppears" || game.state === "bossCaught") {
          tapButton.hidden = false;
          tapButton.textContent = "すすむ";
        } else if (game.state === "ending" && game.endingReady) {
          tapButton.hidden = false;
          tapButton.textContent = "タイトルへ";
        } else {
          tapButton.hidden = true;
        }
      }

      function prepareFish() {
        game.isBossNext = game.normalChinuCount >= 2;
        game.currentFishType = game.isBossNext ? "boss" : "normal";
        game.floatState = "idle";
        game.biteTimer = 0;
        game.catchWindow = 0;
        game.float.sinkAge = 0;
        game.fish.x = 78 + Math.random() * 210;
        game.fish.y = 218 + Math.random() * 125;
        game.fish.phase = Math.random() * 10;

        if (game.currentFishType === "boss") {
          setState("bossAppears");
        }
      }

      function castFloat(x, y) {
        if (game.floatState !== "idle") return;
        playTapSound("cast");

        const dx = x - game.fish.x;
        const dy = y - game.fish.y;
        const nearFish = Math.hypot(dx, dy) < 74;

        game.float.x = x;
        game.float.y = y;
        game.floatState = nearFish ? "waiting" : "badCast";
        game.biteTimer = nearFish ? 74 + Math.random() * 74 : 58;
        game.catchWindow = 0;
        game.float.sinkAge = 0;
        setDialogue(["地の文", nearFish ? "ウキが潮目に乗った。沈黙が少し濃くなる。" : "魚影から離れた。老人の舌打ちが、濡れた板を叩く音に似ている。"]);
      }

      function tryHook() {
        if (game.floatState === "sunk" && game.catchWindow > 0) {
          catchFish();
          return;
        }

        if (game.floatState === "waiting") {
          failCast("早い。ウキはまだ海面に残っている。");
        } else if (game.floatState === "missed") {
          failCast("遅い。沈んだ輪だけが残っている。");
        }
      }

      function failCast(text) {
        game.failCount += 1;
        game.elderAngerLevel = Math.min(3, game.elderAngerLevel + 1);
        game.floatState = "idle";
        game.biteTimer = 0;
        game.catchWindow = 0;
        const elder = elderLines[game.elderAngerLevel] || elderLines[elderLines.length - 1];
        setDialogue(["老人", game.failCount % 2 === 0 ? elder : text]);
      }

      function catchFish() {
        playTapSound("catch");

        if (game.currentFishType === "boss") {
          setState("bossCaught");
          return;
        }

        game.normalChinuCount += 1;
        game.elderAngerLevel = Math.min(3, game.elderAngerLevel + 1);
        const suffix = game.normalChinuCount >= 2
          ? "老人の目だけが、金色を探して岸壁を這う。"
          : "黒銀のチヌが跳ねた。良い魚だ。だが老人は喜ばない。";
        setDialogue(["地の文", `普通のチヌを釣り上げた。${suffix}`]);
        prepareFish();
      }

      function advanceText() {
        ensureAudio();

        if (game.state === "title" || game.state === "returnedTitle") {
          game.normalChinuCount = 0;
          game.isBossNext = false;
          game.currentFishType = "normal";
          game.floatState = "idle";
          game.elderAngerLevel = 0;
          game.failCount = 0;
          setState("intro");
          return;
        }

        if (game.state === "intro") {
          game.introIndex += 1;
          if (game.introIndex >= introLines.length) {
            setState("fishing");
          } else {
            setDialogue(introLines[game.introIndex]);
          }
          return;
        }

        if (game.state === "bossAppears") {
          game.eventIndex += 1;
          if (game.eventIndex >= bossLines.length) {
            game.state = "fishing";
            game.floatState = "idle";
            setDialogue(["地の文", "金色の魚影が、波の下で待っている。"]);
            updateButton();
          } else {
            setDialogue(bossLines[game.eventIndex]);
          }
          return;
        }

        if (game.state === "bossCaught") {
          game.eventIndex += 1;
          if (game.eventIndex >= bossCaughtLines.length) {
            setState("ending");
          } else {
            setDialogue(bossCaughtLines[game.eventIndex]);
          }
          return;
        }

        if (game.state === "ending" && game.endingReady) {
          game.returnedOnce = true;
          game.state = "returnedTitle";
          updateButton();
        }
      }

      function pointerToGame(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * W,
          y: ((event.clientY - rect.top) / rect.height) * H,
        };
      }

      function handlePointer(event) {
        event.preventDefault();
        ensureAudio();

        if (game.state !== "fishing") {
          advanceText();
          return;
        }

        if (game.floatState === "idle") {
          const p = pointerToGame(event);
          castFloat(p.x, p.y);
        } else {
          tryHook();
        }
      }

      function update() {
        game.titleTick += 1;
        game.waveTick += 1;
        game.fish.phase += 0.055;

        if (game.state === "fishing") {
          if (game.floatState === "waiting" || game.floatState === "badCast") {
            game.biteTimer -= 1;
            if (game.biteTimer <= 0) {
              if (game.floatState === "badCast") {
                failCast("餌だけが取られた。");
              } else {
                game.floatState = "sunk";
                game.catchWindow = game.currentFishType === "boss" ? 38 : 44;
                game.float.sinkAge = 0;
                playTapSound("sink");
                setDialogue(["地の文", "ぽちゃん。ウキが沈んだ音だけが大きい。"]);
              }
            }
          } else if (game.floatState === "sunk") {
            game.catchWindow -= 1;
            game.float.sinkAge += 1;
            if (game.catchWindow <= 0) {
              game.floatState = "missed";
              setDialogue(["老人", "遅い。遅い遅い遅い。金が逃げるじゃろうが。"]);
            }
          }

          if (game.currentFishType === "boss" && game.waveTick % 180 === 0) {
            game.showHumanShadowUntil = game.waveTick + 18;
          }
        }

        if (game.state === "ending") {
          game.eventTimer += 1;
          if (game.eventTimer > 100 && game.eventIndex < endingLines.length - 1) {
            game.eventTimer = 0;
            game.eventIndex += 1;
            setDialogue(endingLines[game.eventIndex]);
          }
          if (game.eventIndex === endingLines.length - 1 && game.eventTimer > 60) {
            game.endingReady = true;
            updateButton();
          }
        }

        updateAudioMood();
      }

      function px(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function text(str, x, y, size, color = "#d8d0ba", align = "left") {
        ctx.fillStyle = color;
        ctx.font = `${size}px "Yu Gothic", Meiryo, sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = "top";
        ctx.fillText(str, x, y);
      }

      function wrapText(str, x, y, maxWidth, lineHeight, size, color) {
        ctx.font = `${size}px "Yu Gothic", Meiryo, sans-serif`;
        const chars = Array.from(str);
        let line = "";
        let yy = y;
        chars.forEach((ch) => {
          const next = line + ch;
          if (ctx.measureText(next).width > maxWidth && line) {
            text(line, x, yy, size, color);
            yy += lineHeight;
            line = ch;
          } else {
            line = next;
          }
        });
        if (line) text(line, x, yy, size, color);
      }

      function drawSea() {
        const boss = game.currentFishType === "boss" || game.state === "bossAppears" || game.state === "bossCaught" || game.state === "ending";
        px(0, 0, W, H, boss ? "#04070b" : "#07111b");
        px(0, 0, W, 176, boss ? "#080a0d" : "#0c1118");
        px(0, 176, W, 284, boss ? "#07121c" : "#0c2433");

        for (let y = 190; y < 446; y += 22) {
          const offset = Math.floor(Math.sin(game.waveTick * 0.025 + y) * (boss ? 2 : 6));
          ctx.fillStyle = boss ? "rgba(39, 57, 62, 0.36)" : "rgba(52, 91, 104, 0.45)";
          for (let x = -40; x < W + 40; x += 72) {
            ctx.fillRect(x + offset, y, 34, 2);
          }
        }

        px(0, 432, W, 84, "#15171a");
        for (let x = 0; x < W; x += 40) {
          px(x, 432, 37, 9, "#26282b");
          px(x + 4, 486, 34, 4, "#0d0e10");
        }
        px(0, 516, W, 124, "#07080b");
      }

      function drawElder() {
        const anger = game.elderAngerLevel;
        const frenzy = game.state === "ending" || game.state === "bossCaught";
        if (elderImage.complete && elderImage.naturalWidth > 0) {
          let sprite = elderSprites.normal;

          if (frenzy) {
            const curseFrames = [
              elderSprites.coldSmile,
              elderSprites.obsession,
              elderSprites.blessed,
              elderSprites.possessed,
              elderSprites.rampage,
            ];
            const index = Math.min(curseFrames.length - 1, Math.floor((game.eventIndex * 80 + game.eventTimer) / 62));
            sprite = curseFrames[index];
          } else if (game.currentFishType === "boss") {
            sprite = game.waveTick % 170 < 10 ? elderSprites.madness : elderSprites.obsession;
          } else if (anger >= 3) {
            sprite = game.waveTick % 150 < 9 ? elderSprites.rage : elderSprites.angerStart;
          } else if (anger === 2) {
            sprite = elderSprites.displeased;
          } else if (anger === 1) {
            sprite = elderSprites.bitter;
          } else if (game.state === "intro" && game.introIndex >= 2) {
            sprite = game.introIndex >= 4 ? elderSprites.thinSmile : elderSprites.stare;
          }

          const dx = frenzy ? 194 : 204;
          const dy = frenzy ? 342 : 354;
          const dw = frenzy ? 146 : 134;
          const dh = frenzy ? 104 : 96;
          px(dx - 6, dy - 4, dw + 12, dh + 8, "#020207");
          px(dx - 6, dy - 4, dw + 12, 2, "#7667b4");
          px(dx - 6, dy + dh + 2, dw + 12, 2, "#27204d");
          ctx.drawImage(elderImage, sprite.sx, sprite.sy, sprite.sw, sprite.sh, dx, dy, dw, dh);
          return;
        }

        const x = 206;
        const y = 312;
        const twitch = frenzy ? Math.sin(game.waveTick * 0.35) * 2 : Math.sin(game.waveTick * 0.05);
        const skin = frenzy ? "#8b6d55" : anger >= 2 ? "#76624e" : "#6c5f50";
        const skinDark = frenzy ? "#382015" : "#2c241d";
        const robe = frenzy ? "#261417" : anger >= 2 ? "#242419" : "#2d2e1d";

        px(x + 20, y + 88, 102, 92, "#09090b");
        px(x + 26, y + 90, 92, 78, robe);
        px(x + 42, y + 104, 16, 62, "#18170f");
        px(x + 89, y + 101, 18, 65, "#16160f");
        px(x + 55, y + 82, 42, 42, skinDark);

        // しわと荒い陰影を四角形だけで積む。
        px(x + 47, y + 10 + twitch, 49, 13, skin);
        px(x + 37, y + 21 + twitch, 70, 38, skin);
        px(x + 32, y + 48 + twitch, 79, 52, skin);
        px(x + 26, y + 62 + twitch, 15, 28, skinDark);
        px(x + 104, y + 58 + twitch, 13, 28, skinDark);
        px(x + 39, y + 19 + twitch, 8, 24, "#9a8467");
        px(x + 85, y + 18 + twitch, 7, 24, "#4d3f31");
        px(x + 44, y + 74 + twitch, 52, 10, "#4a3829");
        px(x + 58, y + 92 + twitch, 26, 17, "#3b2a20");

        for (let i = 0; i < 8; i += 1) {
          px(x + 43 + i * 7, y + 29 + (i % 2) * 5 + twitch, 5, 2, "#2f271e");
          px(x + 39 + i * 6, y + 45 + (i % 3) * 4 + twitch, 4, 2, "#a48d70");
        }

        for (let i = 0; i < 12; i += 1) {
          const hx = x + 24 + i * 8;
          const hy = y + 8 + (i % 4) * 7 + twitch;
          px(hx, hy, 2, 20 + (i % 3) * 8, i % 2 ? "#c9bea6" : "#5b544b");
        }

        const eyeGrow = frenzy ? 4 : anger >= 3 ? 3 : anger >= 1 ? 1 : 0;
        px(x + 48, y + 53 + twitch, 20 + eyeGrow, 14 + eyeGrow, "#d9d5c6");
        px(x + 77, y + 52 + twitch, 22 + eyeGrow, 15 + eyeGrow, "#eee9d4");
        px(x + 47, y + 51 + twitch, 24 + eyeGrow, 3, "#211a15");
        px(x + 76, y + 50 + twitch, 25 + eyeGrow, 3, "#211a15");
        if (anger === 0 && !frenzy) {
          px(x + 57, y + 58 + twitch, 4, 4, "#14100d");
          px(x + 87, y + 58 + twitch, 4, 4, "#14100d");
        } else if (game.waveTick % 150 < 8 && !frenzy) {
          px(x + 59, y + 60 + twitch, 2, 2, "#111");
          px(x + 89, y + 60 + twitch, 2, 2, "#111");
        }

        px(x + 63, y + 70 + twitch, 18, 5, "#423225");
        px(x + 58, y + 82 + twitch, anger >= 2 || frenzy ? 36 : 22, anger >= 2 || frenzy ? 15 : 7, "#140809");
        if (anger >= 2 || frenzy) {
          for (let i = 0; i < 6; i += 1) px(x + 62 + i * 5, y + 85 + twitch, 3, 5, "#d7c89f");
          px(x + 63, y + 94 + twitch, 24, 3, "#6b1016");
        } else {
          px(x + 63, y + 85 + twitch, 16, 2, "#d7c89f");
        }

        if (anger >= 1 || frenzy) {
          px(x + 45, y + 67 + twitch, 10, 3, "#2b1715");
          px(x + 91, y + 67 + twitch, 12, 3, "#2b1715");
        }
        if (anger >= 2 || frenzy) {
          px(x + 56, y + 22 + twitch, 4, 17, "#21100d");
          px(x + 61, y + 32 + twitch, 12, 4, "#21100d");
          px(x + 91, y + 24 + twitch, 3, 20, "#21100d");
        }
        if (frenzy) {
          px(x + 35, y + 33 + twitch, 78, 82, "rgba(77, 13, 20, 0.35)");
          px(x + 31, y + 2 + twitch, 5, 18, "#1a0909");
          px(x + 97, y + 4 + twitch, 4, 20, "#1a0909");
          px(x + 60, y + 12 + twitch, 25, 4, "#1a0909");
          px(x + 50, y + 116 + twitch, 52, 9, "#551018");
        }
      }

      function drawFishShadow() {
        const boss = game.currentFishType === "boss";
        const x = game.fish.x + Math.sin(game.fish.phase) * 7;
        const y = game.fish.y + Math.cos(game.fish.phase * 0.8) * 4;

        if (boss && game.waveTick < game.showHumanShadowUntil) {
          px(x - 8, y - 34, 16, 20, "rgba(23, 18, 15, 0.7)");
          px(x - 17, y - 13, 34, 40, "rgba(23, 18, 15, 0.7)");
          return;
        }

        const color = boss ? "rgba(178, 137, 31, 0.76)" : "rgba(10, 22, 28, 0.72)";
        px(x - 22, y - 6, 38, 13, color);
        px(x + 13, y - 3, 12, 7, color);
        px(x - 30, y - 4, 9, 9, color);
        if (boss) px(x - 8, y - 2, 8, 3, "rgba(237, 205, 88, 0.75)");
      }

      function drawFloat() {
        if (game.floatState === "idle") return;

        const x = game.float.x;
        let y = game.float.y;
        if (game.floatState === "sunk" || game.floatState === "missed") {
          y += Math.min(18, game.float.sinkAge);
        } else {
          y += Math.sin(game.waveTick * 0.16) * 2;
        }

        ctx.strokeStyle = "rgba(179, 169, 137, 0.7)";
        ctx.beginPath();
        ctx.moveTo(302, 392);
        ctx.lineTo(x, y);
        ctx.stroke();

        if (game.floatState !== "missed") {
          px(x - 2, y - 12, 4, 10, "#eee2c2");
          px(x - 3, y - 2, 6, 8, "#7a1016");
          px(x - 5, y + 6, 10, 2, "rgba(238, 226, 194, 0.35)");
        } else {
          px(x - 8, y, 16, 2, "rgba(238, 226, 194, 0.25)");
        }
      }

      function drawHud() {
        px(10, 10, 122, 35, "#020309");
        px(12, 12, 118, 31, "rgba(4, 6, 8, 0.9)");
        px(12, 12, 118, 2, "#6f62aa");
        px(12, 43, 118, 2, "#24204d");
        px(10, 10, 2, 35, "#2e2a69");
        px(130, 10, 2, 35, "#2e2a69");
        text(`チヌ ${Math.min(game.normalChinuCount, 2)} / 2`, 22, 19, 15, "#e6dcc2");

        const guide = game.floatState === "idle"
          ? "魚影付近をタップ"
          : game.floatState === "sunk"
            ? "今、合わせる"
            : "沈むまで待つ";
        px(212, 10, 138, 35, "#020309");
        px(214, 12, 134, 31, "rgba(4, 6, 8, 0.9)");
        px(214, 12, 134, 2, "#6f62aa");
        px(214, 43, 134, 2, "#24204d");
        px(212, 10, 2, 35, "#2e2a69");
        px(348, 10, 2, 35, "#2e2a69");
        text(guide, 281, 19, 14, game.floatState === "sunk" ? "#d8b33e" : "#d0c5a9", "center");
      }

      function drawDialogue() {
        px(8, 512, 344, 120, "#020207");
        px(12, 516, 336, 112, "rgba(5, 6, 8, 0.96)");
        px(12, 516, 336, 2, "#7667b4");
        px(12, 626, 336, 2, "#27204d");
        px(12, 516, 2, 112, "#30296a");
        px(346, 516, 2, 112, "#30296a");
        px(20, 526, 82, 22, "#08091a");
        px(20, 526, 82, 2, "#7667b4");
        text(game.speaker || "地の文", 61, 530, 13, "#b8a7ff", "center");
        wrapText(game.message || "", 24, 558, 312, 21, 15, "#e6dec9");
        px(334, 609, 6, 6, "#9c91df");
        px(331, 612, 12, 3, "#58509a");
      }

      function drawTitle() {
        drawSea();
        px(0, 0, W, H, "rgba(0, 0, 0, 0.32)");
        text("日本海千年釣り物語", 180, 124, 25, "#e5d9b8", "center");
        text("序：黄金のチヌ", 180, 164, 19, "#b99328", "center");
        text("古い祠と、礼を欠いた欲の話", 180, 224, 14, "#918875", "center");
        if (game.returnedOnce || game.state === "returnedTitle") {
          px(104, 281, 152, 32, "rgba(14, 13, 12, 0.84)");
          text("供える（未実装）", 180, 289, 14, "#6f6759", "center");
        }
      }

      function drawEventBurst() {
        if (game.state !== "ending") return;

        const t = game.eventIndex * 80 + game.eventTimer;
        if (game.eventIndex >= 1) {
          for (let i = 0; i < 18; i += 1) {
            const a = i * 0.82 + t * 0.025;
            const r = Math.min(270, 18 + t * 0.9 + i * 5);
            const x = 296 + Math.cos(a) * r;
            const y = 414 + Math.sin(a) * r * 0.58;
            px(x, y, 8, 12, i % 3 === 0 ? "#7d151d" : "#32070b");
            px(x + 2, y + 2, 3, 3, "#b99328");
          }
        }
      }

      function drawScene() {
        drawSea();
        drawElder();

        if (game.state === "fishing" || game.state === "bossAppears") {
          drawFishShadow();
          drawFloat();
          drawHud();
        }

        if (game.state === "bossCaught" || game.state === "ending") {
          px(118, 312, 48, 15, "#b99328");
          px(156, 316, 13, 8, "#d8bd55");
          px(108, 316, 11, 8, "#765f1e");
        }

        drawEventBurst();

        if (game.currentFishType === "boss" || game.state === "bossAppears" || game.state === "bossCaught" || game.state === "ending") {
          px(0, 0, W, H, "rgba(0, 0, 0, 0.18)");
        }

        drawDialogue();
      }

      function render() {
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, W, H);

        if (game.state === "title" || game.state === "returnedTitle") {
          drawTitle();
        } else {
          drawScene();
        }
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener("pointerdown", handlePointer);
      tapButton.addEventListener("click", (event) => {
        event.preventDefault();
        advanceText();
      });
      musicToggle.addEventListener("click", (event) => {
        event.preventDefault();
        toggleBgm();
        ensureAudio();
      });
      bgm.addEventListener("error", () => {
        sound.bgmFailed = true;
        updateMusicButton();
      });

      updateMusicButton();
      updateButton();
      loop();
    })();
  </script>
</body>
</html>
